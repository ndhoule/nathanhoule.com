name: Test

on:
  push:
  workflow_dispatch:

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    container: node:24
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Configure Node
        uses: actions/setup-node@v3
        with:
          node-version: 24.x
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
  build-and-push-container-image:
    name: Build and push container image
    if: forgejo.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-js-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          password: ${{ secrets.DOCKER_HUB_TOKEN }}
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          build-args: |
            PUBLIC_MAPTILER_API_KEY=${{ secrets.PUBLIC_MAPTILER_API_KEY }}
          push: true
          tags: |
            ndhoule/nathanhoule.com:latest
            ndhoule/nathanhoule.com:${{ forgejo.sha }}
  deploy:
    name: Deploy
    if: forgejo.ref == 'refs/heads/main'
    needs: build-and-push-container-image
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Configure Nomad
        uses: https://github.com/nferch/setup-nomad@v4.0.0
      - name: Deploy to Nomad
        run: NOMAD_SKIP_VERIFY=1 NOMAD_ADDR="https://nomad.nathanhoule.net" NOMAD_TOKEN="${{ secrets.NOMAD_TOKEN }}" IMAGE_TAG="${{ forgejo.sha }}" scripts/deploy
